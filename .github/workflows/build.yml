name: Build and Release Multi-Platform

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

jobs:
    build:
        name: Build (${{ matrix.target }})
        runs-on: ${{ matrix.os }}
        env:
            TARGET_PLATFORM: ${{ matrix.target }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-latest
                      target: windows-x64
                    - os: ubuntu-latest
                      target: linux-x64
                    - os: macos-15-intel # Intel 芯片 Mac
                      target: darwin-x64
                    - os: macos-15 # Apple 芯片 Mac
                      target: darwin-arm64

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "26"
                  cache: npm

            - name: Install dependencies
              run: npm ci --omit=dev

            - name: Run Build Script
              run: npm run build

            # 跨平台打包：Windows 产出 .zip，Linux/macOS 产出 .tar.gz
            - name: Pack Artifact (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $VERSION = (Get-Content package.json | ConvertFrom-Json).version
                  $TARGET_DIR = "MimicM3U8Downloader-v$VERSION-$env:TARGET_PLATFORM"
                  Compress-Archive -Path "dist/$TARGET_DIR/*" -DestinationPath "dist/$TARGET_DIR.zip" -Force

            - name: Pack Artifact (Linux & macOS)
              if: runner.os != 'Windows'
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  TARGET_DIR="MimicM3U8Downloader-v$VERSION-$TARGET_PLATFORM"
                  tar -czf "dist/$TARGET_DIR.tar.gz" -C dist "$TARGET_DIR"

            # 将打包好的压缩包作为 CI 产物上传（保留 90 天）
            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.target }}-binary
                  path: |
                      dist/*.zip
                      dist/*.tar.gz

    release:
        name: Create GitHub Release
        needs: build
        if: startsWith(github.ref, 'refs/tags/') # 仅在推送 tag 时自动创建 Release 发布
        runs-on: ubuntu-latest
        steps:
            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: dist-artifacts

            - name: Flatten folder structure
              run: |
                  mkdir out
                  find dist-artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} out/ \;

            - name: Create Release and Upload Assets
              uses: softprops/action-gh-release@v2
              with:
                  files: out/*
                  generate_release_notes: true # 开启此项后，GitHub 会自动生成 "What's Changed" 变更日志
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
